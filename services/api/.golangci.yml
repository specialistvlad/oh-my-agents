version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - godot
    - noctx
    - bodyclose
    - exhaustive
    - gocyclo
    - gocognit
    - funlen
    - dupl
  settings:
    exhaustive:
      # A default case genuinely handles the remaining members, so it counts
      # as exhaustive. Switches without one are still required to cover every
      # member, which is where the linter earns its keep.
      default-signifies-exhaustive: true
    misspell:
      locale: US
    godot:
      scope: declarations
      capital: false
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    funlen:
      lines: 100
      statements: 60
    dupl:
      threshold: 200
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - godot
          - funlen
          - gocyclo
          - gocognit
          - dupl
      # Conformance suites are tests, but they cannot be named _test.go
      # because the adapters they check import them. The readability limits
      # are a production-code rule, and a suite that enumerates cases is long
      # by nature — the same reasoning that exempts _test.go above.
      - path: (^|/)[a-z]+test/
        linters:
          - funlen
          - gocyclo
          - gocognit
          - dupl

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
