version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - godot
    - noctx
    - bodyclose
    - exhaustive
    - gocyclo
    - gocognit
    - funlen
    - dupl
  settings:
    misspell:
      locale: US
    godot:
      scope: declarations
      capital: false
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    funlen:
      lines: 100
      statements: 60
    dupl:
      threshold: 200
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - godot
          - funlen
          - gocyclo
          - gocognit
          - dupl

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
